name: Build IPA

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install XcodeGen
        run: brew install xcodegen
        
      - name: Generate Xcode Project
        run: xcodegen generate
        
      - name: Build App
        run: |
          xcodebuild -project PPayTerminal.xcodeproj -scheme PPayTerminal -sdk iphoneos -configuration Release -derivedDataPath ./build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          
      - name: Package IPA
        run: |
          mkdir Payload
          mv build/Build/Products/Release-iphoneos/PPayTerminal.app Payload/
          zip -r PPayTerminal.ipa Payload
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PPayTerminal.ipa
          path: PPayTerminal.ipa
